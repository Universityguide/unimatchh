button,input,select{font:inherit}button{cursor:pointer}.wrap{width:min(1120px,92%);margin:auto}.nav{position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}

async function resetPw(){if(!auth)return alert("ต้องใส่ Firebase Config ก่อน");if(!em.value)return alert("ใส่อีเมลก่อน");await fb.sendPasswordResetEmail(auth,em.value);alert("ส่งลิงก์รีเซ็ตแล้ว")}
function mbtiPage(){shell(`<main class="section"><div class="wrap"><div class="title"><h2>🧠 เลือก MBTI ของคุณ</h2><p>ไม่มีแบบทดสอบ ให้เลือกประเภทที่คุณรู้จักตัวเองอยู่แล้ว</p></div><div class="mbti">${Object.entries(M).map(([k,d])=>`<button onclick="pick('${k}')"><span class="badge ${d[0].toLowerCase()}">${d[0]}</span><h3>${k}</h3><b>${d[1]}</b><p class="muted">${d[2].slice(0,2).join(" · ")}</p></button>`).join("")}</div><div id="mr"></div></div></main>`)}
function pick(k){mbti=k;document.getElementById("mr").innerHTML=`<div class="form"><span class="badge ${M[k][0].toLowerCase()}">${M[k][0]}</span><h2>${k} — ${M[k][1]}</h2><h3>🎯 คณะที่แนะนำ</h3><p>${M[k][2].map(x=>`<span class="tag">⭐ ${x}</span>`).join("")}</p><button class="primary" onclick="go('questionnaire')">ทำแบบสอบถามต่อ →</button></div>`}
function questionnaire(){shell(`<main class="section"><div class="wrap"><div class="title"><h2>📝 เราเหมาะกับคณะอะไร?</h2></div><div class="form"><div class="field"><label>วิชาที่ชอบ</label><select id="q1"><option>science</option><option>language</option><option>art</option><option>business</option><option>people</option></select></div><div class="field"><label>ลักษณะงาน</label><select id="q2"><option>analysis</option><option>creative</option><option>people</option><option>system</option><option>hands</option></select></div><div class="field"><label>ความสนใจ</label><select id="q3"><option>tech</option><option>health</option><option>media</option><option>law</option><option>travel</option></select></div><button class="primary" onclick="calcQ()">✨ ดูผล</button><div id="qr"></div></div></div></main>`)}
function calcQ(){let s={};const add=(x)=>s[x]=(s[x]||0)+1;const a=[q1.value,q2.value,q3.value];if(a.includes("science"))["วิศวกรรมศาสตร์","วิทยาการคอมพิวเตอร์","วิทยาศาสตร์"].forEach(add);if(a.includes("language"))["อักษรศาสตร์","นิติศาสตร์","นิเทศศาสตร์"].forEach(add);if(a.includes("art"))["ศิลปกรรมศาสตร์","สถาปัตยกรรมศาสตร์","นิเทศศาสตร์"].forEach(add);if(a.includes("business"))["บริหารธุรกิจ","เศรษฐศาสตร์","บัญชี"].forEach(add);if(a.includes("people"))["จิตวิทยา","ครุศาสตร์","นิเทศศาสตร์"].forEach(add);if(a.includes("analysis"))["เศรษฐศาสตร์","วิทยาการคอมพิวเตอร์","วิศวกรรมศาสตร์"].forEach(add);if(a.includes("creative"))["นิเทศศาสตร์","ศิลปกรรมศาสตร์"].forEach(add);if(a.includes("tech"))["วิทยาการคอมพิวเตอร์","วิศวกรรมศาสตร์"].forEach(add);if(a.includes("health"))["แพทยศาสตร์","วิทยาศาสตร์","จิตวิทยา"].forEach(add);if(a.includes("media"))["นิเทศศาสตร์","ศิลปกรรมศาสตร์"].forEach(add);if(a.includes("law"))["นิติศาสตร์","เศรษฐศาสตร์"].forEach(add);if(a.includes("travel"))["การท่องเที่ยว","บริหารธุรกิจ"].forEach(add);let top=Object.entries(s).sort((a,b)=>b[1]-a[1]).slice(0,5);qr.innerHTML=`<div class="stars"><h3>🎯 ผลการแนะนำ</h3>${top.map((x,i)=>`<div class="star">#${i+1} ${x[0]}</div>`).join("")}<br><button class="primary" onclick="go('universities')">ไปดูมหาวิทยาลัย →</button></div>`}
function unis(){shell(`<main class="section"><div class="wrap"><div class="title"><h2>🏫 มหาวิทยาลัย</h2><p>ค้นหา เลือก และดูคณะเด่น</p></div><div class="toolbar"><input class="search" id="us" oninput="filterU()" placeholder="🔎 ค้นหามหาวิทยาลัย"><button class="outline" onclick="go('compare')">⚖️ เปรียบเทียบ</button></div><div id="ug" class="grid"></div></div></main>`);filterU()}
function logo(d){return `<img src="https://www.google.com/s2/favicons?domain=${d}&sz=128" onerror="this.style.display='none';this.nextElementSibling.classList.remove('hidden')"><span class="hidden">🎓</span>`}
function filterU(){let q=(us?.value||"").toLowerCase();ug.innerHTML=U.filter(u=>(u[0]+u[1]).toLowerCase().includes(q)).map(u=>{let i=U.indexOf(u);return `<div class="card uni" onclick="openU(${i})"><div class="logo">${logo(u[2])}</div><h3>${u[0]}</h3><p class="muted">${u[3]}</p>${u[4].map(x=>`<span class="badge sp">⭐ ${x}</span>`).join("")}</div>`}).join("")}
function openU(i){curU=i;view="university";render();scrollTo(0,0)}
function university(){let u=U[curU];shell(`<main class="section"><div class="wrap"><button class="outline" onclick="go('universities')">← กลับ</button><div class="banner"><div class="top"><div class="logo">${logo(u[2])}</div><div><h1>${u[0]}</h1><p class="muted">${u[3]}</p><button class="outline" onclick="favU()">${fav.u.includes(u[0])?"❤️ บันทึกแล้ว":"♡ บันทึก"}</button></div></div></div><div class="stars"><h2>⭐ คณะเด่นของ ${u[1]}</h2>${u[4].map(x=>`<span class="star">⭐ ${x}</span>`).join("")}</div><div class="grid"><div class="card"><h3>⭐ จุดเด่น</h3><p>${u[5]}</p></div><div class="card"><h3>⚠️ จุดที่ควรพิจารณา</h3><p>${u[6]}</p></div><div class="card"><h3>📋 การสมัคร</h3><p>ดูขั้นตอนและตรวจประกาศล่าสุด</p><button class="primary" onclick="go('apply')">ดูวิธีสมัคร →</button></div></div><section class="section"><div class="title"><h2>📚 คณะทั้งหมด</h2></div><div class="toolbar"><input class="search" id="fs" oninput="filterF()" placeholder="🔎 ค้นหาคณะ"><button class="outline" onclick="go('compare')">⚖️ เปรียบเทียบ (${sel.length})</button></div><div id="fg" class="grid"></div></section></div></main>`);filterF()}
function facultyInfo(name){let clean=name.replace(/^คณะ/,'');if(FACULTY_DETAILS[clean])return FACULTY_DETAILS[clean];let f=F.find(x=>x[0]===clean||x[0]===name);if(f)return [f[1],f[2],f[3],f[4]];return ["🎓","ข้อมูลเบื้องต้นของคณะ/วิทยาลัยนี้ ให้ตรวจหลักสูตรย่อยและเกณฑ์รับสมัครใน MyTCAS",["ดูโครงสร้างหลักสูตร","ตรวจคุณสมบัติรายหลักสูตร"],["อาชีพขึ้นอยู่กับสาขาที่เลือก","ศึกษาต่อ/ทำงานตามคุณวุฒิ"]]}
function filterF(){let u=U[curU],q=(fs?.value||"").toLowerCase();fg.innerHTML=u[7].map(n=>({name:n,info:facultyInfo(n)})).filter(x=>x.name.toLowerCase().includes(q)).map(x=>cardF(x,u[4].some(h=>x.name.includes(h)||h.includes(x.name)))).join("")}
function cardF(x,hot){let name=x.name,info=x.info,chosen=sel.includes(name);return `<div class="card fac">${hot?'<div class="hot">⭐ คณะเด่น</div>':""}<h3>${info[0]} ${esc(name)}</h3><p>${info[1]}</p><b>👤 เหมาะกับ</b><ul>${info[2].map(a=>`<li>${a}</li>`).join("")}</ul><b>💼 แนวอาชีพ</b><p>${info[3].join(" · ")}</p><details><summary>⭐ จุดเด่น / ⚠️ จุดที่ควรพิจารณา</summary><p>จุดเด่น: สามารถต่อยอดไปยังหลายสาขาอาชีพตามหลักสูตรย่อยได้</p><p>ควรพิจารณา: ชื่อสาขา วิชาเรียน คุณสมบัติ และเส้นทางอาชีพแตกต่างกันในแต่ละมหาวิทยาลัย</p></details><div class="actions"><button class="outline" onclick="favF('${esc(name)}')">${fav.f.includes(name)?"❤️ บันทึกแล้ว":"♡ บันทึก"}</button><button class="${chosen?"primary":"outline"}" onclick="selectF('${esc(name)}')">${chosen?"☑️ เลือกแล้ว":"☑️ เปรียบเทียบ"}</button></div><button class="outline" style="margin-top:8px;width:100%" onclick="openFacultyApply('${esc(name)}')">📋 ดูวิธีสมัครของคณะนี้</button></div>`}
function openFacultyApply(name){let u=U[curU];let info=facultyInfo(name);let panel=document.getElementById("panel");if(panel)panel.remove();panel=document.createElement("div");panel.id="panel";panel.className="panel";panel.innerHTML=`<b>${info[0]} ${esc(name)}</b><p class="muted">มหาวิทยาลัย: ${u[0]}</p>${ROUNDS.map(r=>`<div style="border-top:1px solid var(--line);padding:10px 0"><b>${r.icon} รอบ ${r.id} ${r.name}</b><p style="margin:5px 0">${r.how}</p></div>`).join("")}<a class="primary" style="display:block;text-align:center;text-decoration:none;margin-top:8px" href="https://course.mytcas.com/universities" target="_blank" rel="noopener">🔎 ตรวจหลักสูตรจริงใน MyTCAS</a>`;document.body.append(panel)}
function favU(){let n=U[curU][0],i=fav.u.indexOf(n);i<0?fav.u.push(n):fav.u.splice(i,1);save();render()}
function favF(n){let i=fav.f.indexOf(n);i<0?fav.f.push(n):fav.f.splice(i,1);save();render()}
function selectF(n){let i=sel.indexOf(n);i<0?sel.push(n):sel.splice(i,1);save();render()}
function compare(){shell(`<main class="section"><div class="wrap"><div class="title"><h2>⚖️ เปรียบเทียบคณะ</h2><p>เลือกจากหน้ามหาวิทยาลัย</p></div><div class="card">${sel.length<1?`<p>ยังไม่ได้เลือกคณะ</p><button class="primary" onclick="go('universities')">ไปเลือกคณะ</button>`:`<table class="compare"><tr><th>หัวข้อ</th>${sel.map(n=>`<th>${esc(n)}</th>`).join("")}</tr><tr><th>เรียนอะไร</th>${sel.map(n=>`<td>${facultyInfo(n)[1]}</td>`).join("")}</tr><tr><th>เหมาะกับ</th>${sel.map(n=>`<td>${facultyInfo(n)[2].join("<br>")}</td>`).join("")}</tr><tr><th>แนวอาชีพ</th>${sel.map(n=>`<td>${facultyInfo(n)[3].join("<br>")}</td>`).join("")}</tr></table>`}</div><section class="section"><div class="title"><h2>🏫 เปรียบเทียบมหาวิทยาลัย</h2></div><div class="card"><p class="muted">เลือกอย่างน้อย 2 แห่ง</p>${U.map(u=>`<label class="tag"><input type="checkbox" value="${u[0]}" onchange="uniCmp()"> ${u[1]}</label>`).join("")}<div id="uc"></div></div></section></div></main>`)}
function uniCmp(){let a=[...document.querySelectorAll('#root input[type=checkbox]:checked')].map(x=>x.value);if(a.length<2){uc.innerHTML="";return}uc.innerHTML=`<table class="compare" style="margin-top:15px"><tr><th>หัวข้อ</th>${a.map(n=>`<th>${n}</th>`).join("")}</tr><tr><th>คติพจน์</th>${a.map(n=>`<td>${U.find(u=>u[0]===n)[3]}</td>`).join("")}</tr><tr><th>จุดเด่น</th>${a.map(n=>`<td>${U.find(u=>u[0]===n)[5]}</td>`).join("")}</tr><tr><th>ข้อควรพิจารณา</th>${a.map(n=>`<td>${U.find(u=>u[0]===n)[6]}</td>`).join("")}</tr></table>`}
function schedule(){shell(`<main class="section"><div class="wrap"><div class="title"><h2>📚 ตารางอ่านหนังสือ</h2><p>สร้างตารางตัวอย่างในหน้าเว็บเดียวกัน</p></div><div class="form"><div class="field"><label>คณะที่เตรียม</label><select id="sf">${F.map(f=>`<option>${f[0]}</option>`).join("")}</select></div><div class="field"><label>วิชา (คั่นด้วย ,)</label><input id="sub" placeholder="คณิตศาสตร์, ภาษาอังกฤษ, ฟิสิกส์"></div><div class="field"><label>วันที่ว่าง (คั่นด้วย ,)</label><input id="day" placeholder="จันทร์, พุธ, ศุกร์"></div><div class="field"><label>เวลา</label><input id="tm" placeholder="18:00-21:00"></div><div class="field"><label>นาทีต่อวัน</label><input id="mi" type="number" value="60"></div><button class="primary" onclick="makeS()">✨ สร้างตาราง</button><div id="sr"></div></div></div></main>`)}
function makeS(){let s=sub.value.split(",").map(x=>x.trim()).filter(Boolean),d=day.value.split(",").map(x=>x.trim()).filter(Boolean),m=Number(mi.value)||60;if(!s.length||!d.length)return alert("กรอกวิชาและวันก่อน");sr.innerHTML=`<div class="days" style="margin-top:20px">${d.map((x,i)=>`<div class="day"><h3>📅 ${x}</h3><b>${tm.value||"เวลาที่เลือก"}</b><p>${s[i%s.length]} · ${m} นาที</p></div>`).join("")}</div><button class="outline" style="margin-top:12px" onclick="localStorage.setItem('um_schedule',sr.innerText);alert('บันทึกตารางแล้ว ❤️')">❤️ บันทึกตาราง</button>`}
function saved(){shell(`<main class="section"><div class="wrap"><div class="title"><h2>❤️ สิ่งที่ฉันบันทึกไว้</h2></div><div class="card"><h3>🏫 มหาวิทยาลัย</h3><p>${fav.u.length?fav.u.join(" · "):"ยังไม่มี"}</p><h3>📚 คณะ</h3><p>${fav.f.length?fav.f.join(" · "):"ยังไม่มี"}</p><h3>📚 ตารางอ่าน</h3><p>${localStorage.getItem("um_schedule")||"ยังไม่มี"}</p></div></div></main>`)}
function apply(){let u=U[curU];shell(`<main class="section"><div class="wrap"><div class="title"><h2>📋 วิธีสมัคร TCAS — ${u?u[0]:"ทุกมหาวิทยาลัย"}</h2><p>โครงสร้างรอบอิงระบบ TCAS70; รายละเอียดจริงต้องตรวจที่ระดับหลักสูตร</p></div><div class="grid">${ROUNDS.map(r=>`<div class="card"><div class="badge ${r.id===1?"nt":r.id===2?"sp":r.id===3?"nf":"sj"}">${r.icon} รอบ ${r.id}</div><h3>${r.name}</h3><p><b>เหมาะกับ:</b> ${r.who}</p><p><b>ช่วงเวลา:</b> ${r.when}</p><p>${r.how}</p><a class="outline" style="display:inline-block;text-decoration:none" href="${r.link}" target="_blank" rel="noopener">🔎 ตรวจประกาศล่าสุด</a></div>`).join("")}</div><div class="notice"><b>⚠️ สำคัญ:</b> MyTCAS แสดงการเปิดรับเป็นรายหลักสูตร ไม่ใช่ทุกคณะจะเปิดครบทั้ง 4 รอบ ดังนั้นก่อนสมัครต้องกดดูหลักสูตรที่สนใจและอ่านคุณสมบัติ/จำนวนรับ/เกณฑ์คะแนนของหลักสูตรนั้นโดยตรง</div>${u?`<a class="primary" style="display:inline-block;text-decoration:none" href="https://course.mytcas.com/universities" target="_blank" rel="noopener">🌐 เปิดฐานข้อมูลคณะและหลักสูตร MyTCAS</a>`:""}</div></main>`)}
function notice(){let x=document.getElementById("panel");if(x){x.remove();return}x=document.createElement("div");x.id="panel";x.className="panel";x.innerHTML="<b>🔔 กำหนดการสำคัญ</b>"+U.slice(0,6).map((u,i)=>`<p>🏫 ${u[1]}<br><span class="muted">ตัวอย่างแจ้งเตือน: กำหนดการสมัครใกล้ถึง</span></p>`).join("")+'<small>หมายเหตุ: วันที่ในเดโมยังไม่ใช่กำหนดการจริง ควรตรวจประกาศทางการ</small>';document.body.append(x)}
function profile(){
let x=document.getElementById("panel");if(x){x.remove();return}
x=document.createElement("div");x.id="panel";x.className="panel";
x.innerHTML=`<b>✨ UniMatch</b>
<button onclick="go('saved')">❤️ สิ่งที่บันทึก</button>
<button onclick="go('mbti')">🧠 เปลี่ยน MBTI</button>`;
document.body.append(x)
}
function logout(){go("home")}
window.go=go;window.pick=pick;window.calcQ=calcQ;window.filterU=filterU;window.openU=openU;window.filterF=filterF;window.favU=favU;window.favF=favF;window.selectF=selectF;window.uniCmp=uniCmp;window.makeS=makeS;window.notice=notice;window.profile=profile;window.logout=logout;
render();
</script></body></html>
